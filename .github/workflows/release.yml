name: Release

# Publishes `dsh-agent-persona` to npm via npm Trusted Publishing (OIDC) —
# no NPM_TOKEN secret, provenance attached to the tarball.
#
# Trigger: a GitHub Release is published (tag vX.Y.Z). The tag MUST match
# package.json `version`; the workflow verifies this before publishing.
#
# Dist-tag policy: a prerelease version (e.g. v0.2.0-rc.1) publishes under the
# npm `next` dist-tag so `latest` keeps pointing at the last stable cut; stable
# versions publish as `latest`.
#
# One-time npm-side setup (manual, on npmjs.com — the only step that cannot be
# done from this repository):
#   1. package `dsh-agent-persona` -> Settings -> Trusted Publishers
#      -> "Add Trusted Publisher".
#   2. Provider: GitHub Actions
#      Organization or user: Awoodwhale
#      Repository:           dsh-agent-persona
#      Workflow filename:    release.yml
#      Environment:          (blank)
#   3. Save. Do NOT add an NPM_TOKEN secret — Trusted Publishing replaces it.
# Canonical reference: https://docs.npmjs.com/trusted-publishers
#
# Note on the npm version: Trusted Publishing needs npm CLI >= 11.5.1, and the
# npm bundled with Node 22 on runners is 10.x, so the workflow upgrades npm
# before publishing. (The pnpm-based sibling project does not need this step
# because pnpm implements the OIDC exchange itself.)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify everything, but do not publish
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # mint the OIDC token npm Trusted Publishing exchanges

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: build · verify · publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          echo "package.json version: ${expected#v}"
          echo "release tag:          ${RELEASE_TAG}"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package.json version ${expected#v} (expected ${expected})."
            exit 1
          fi

      # Same gates as ci.yml, in the same order, so a release can only ship what
      # a pull request would have had to pass.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Trusted Publishing needs npm CLI >= 11.5.1 (Node 22 ships 10.x).
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Dry-run publish (validation only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run

      - name: Publish to npm
        if: github.event_name == 'release' || github.event.inputs.dry_run != 'true'
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          echo "publishing to npm dist-tag: ${TAG}"
          npm publish --provenance --access public --tag "$TAG"
