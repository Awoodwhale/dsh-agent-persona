name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin has no runtime dependencies: the host provides every
      # @deepseek-ai/* service it uses, so the suite only needs Node.
      - run: npm run check
      - run: npm test
