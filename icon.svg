  <path d="M25 32.5l2.8 2.4-2.8 2.4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30.6 37.3h4.4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
