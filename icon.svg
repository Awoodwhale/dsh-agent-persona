<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Agent Persona">
  <defs>
    <linearGradient id="persona-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- A persona is a card you can hand to a workspace: the back card is the pool, the front card is
       the one this workspace gets. The prompt badge on the front card is the system prompt it sends. -->
